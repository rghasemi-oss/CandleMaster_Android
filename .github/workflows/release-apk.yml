name: Release Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: |
          ANDROID_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -z "$ANDROID_DIR" ]; then
            ANDROID_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
          fi

          if [ -z "$ANDROID_DIR" ]; then
            echo "Android project directory not found."
            exit 1
          fi

          cd "$ANDROID_DIR"

          if [ -f "./scripts/sync_assets.sh" ]; then
            chmod +x ./scripts/sync_assets.sh
            ./scripts/sync_assets.sh || true
          fi

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/raw

          gradle :app:assembleDebug --no-daemon

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/release/CandleMaster.apk"

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \`r`n            release/CandleMaster.apk \`r`n            --repo "${{ github.repository }}" \`r`n            --title "CandleMaster $RELEASE_TAG" \`r`n            --generate-notes

