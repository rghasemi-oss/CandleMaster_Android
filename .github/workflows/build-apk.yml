name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17' # بازگشت به نسخه پایدار ۱۷ برای هماهنگی با گرادل ۸
        cache: 'gradle'

    # تنظیم دقیق نسخه گرادل روی ۸.۷ برای حل ارور خط ۱ پروژه شما
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build APK with Fixed Gradle
      run: |
        ANDROID_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
        if [ -z "$ANDROID_DIR" ]; then
          ANDROID_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
        fi
        
        cd "$ANDROID_DIR"
        
        if [ -f "./scripts/sync_assets.sh" ]; then
          chmod +x ./scripts/sync_assets.sh
          ./scripts/sync_assets.sh || true
        fi
        
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/raw
        
        # اجرای ساخت با نسخه مشخص شده ۸.۷
        gradle assembleDebug --no-daemon

        mkdir -p $GITHUB_WORKSPACE/output_apk
        cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output_apk/CandleMaster.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: CandleMaster-Debug-APK
        path: output_apk/CandleMaster.apk
