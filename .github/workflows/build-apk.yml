name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # به شما اجازه می‌دهد دستوری و دستی هم ساخت را اجرا کنید

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Change script permissions
      run: chmod +x scripts/sync_assets.sh

    - name: Sync Assets (Run custom script)
      run: ./scripts/sync_assets.sh
      continue-on-error: true # اگر پوشه‌های بیرونی خالی بودند، پروسه متوقف نشود

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: CandleMaster-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
