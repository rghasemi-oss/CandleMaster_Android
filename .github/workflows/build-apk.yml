name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    # نصب مستقیم و خودکار سیستم گرادل روی سرور گیت‌هاب (حل مشکل نبود فایل gradlew)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build APK without Wrapper
      run: |
        # پیدا کردن پوشه اصلی که کدهای اندروید در آن قرار دارد (جایی که فایل settings.gradle هست)
        ANDROID_DIR=$(find . -name "settings.gradle*" -exec dirname {} \;)
        
        if [ -z "$ANDROID_DIR" ]; then
          echo "❌ Error: Could not find an Android project directory!"
          exit 1
        fi
        
        echo "✅ Found Android project in: $ANDROID_DIR"
        cd "$ANDROID_DIR"
        
        # اجرای اسکریپت جابه‌جایی دارایی‌ها در صورت وجود
        if [ -f "./scripts/sync_assets.sh" ]; then
          chmod +x ./scripts/sync_assets.sh
          ./scripts/sync_assets.sh || true
        elif [ -f "../scripts/sync_assets.sh" ]; then
          chmod +x ../scripts/sync_assets.sh
          ../scripts/sync_assets.sh || true
        fi
        
        # ساخت پوشه‌های ضروری جهت اطمینان
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/raw
        
        # ساخت فایل نصب با استفاده از گرادل نصب شده روی سیستم گیت‌هاب
        gradle assembleDebug --no-daemon

        # جمع‌آوری و جابه‌جایی فایل خروجی برای آپلود
        mkdir -p $GITHUB_WORKSPACE/output_apk
        cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output_apk/CandleMaster.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: CandleMaster-Debug-APK
        path: output_apk/CandleMaster.apk
