name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5 # ارتقا به نسخه ۵ برای رفع هشدارهای گیت‌هاب
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Make script executable
      run: chmod +x scripts/sync_assets.sh
      continue-on-error: true

    - name: Sync Assets (Run custom script)
      run: |
        # ساخت دسته‌جمعی پوشه‌های مورد نیاز برای جلوگیری از ارور اسکریپت
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/raw
        # اجرای اسکریپت به صورتی که کل پروسه را خراب نکند
        ./scripts/sync_assets.sh || true
      continue-on-error: true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: CandleMaster-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
