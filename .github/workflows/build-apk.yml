name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build APK without Wrapper
      run: |
        # پیدا کردن دقیق پوشه اندروید بر اساس فایل تنظیمات کاتلین
        ANDROID_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
        
        if [ -z "$ANDROID_DIR" ]; then
          # اگر کاتلین نبود، فایل معمولی را چک کند
          ANDROID_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
        fi
        
        if [ -z "$ANDROID_DIR" ]; then
          echo "❌ Error: Could not find any Android project directory!"
          exit 1
        fi
        
        echo "✅ Selected Android project directory: $ANDROID_DIR"
        cd "$ANDROID_DIR"
        
        # اجرای اسکریپت دارایی‌ها در صورت وجود
        if [ -f "./scripts/sync_assets.sh" ]; then
          chmod +x ./scripts/sync_assets.sh
          ./scripts/sync_assets.sh || true
        elif [ -f "../scripts/sync_assets.sh" ]; then
          chmod +x ../scripts/sync_assets.sh
          ../scripts/sync_assets.sh || true
        fi
        
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/raw
        
        # ساخت فایل نصب
        gradle assembleDebug --no-daemon

        # انتقال فایل خروجی به پوشه اصلی جهت آپلود
        mkdir -p $GITHUB_WORKSPACE/output_apk
        cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output_apk/CandleMaster.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: CandleMaster-Debug-APK
        path: output_apk/CandleMaster.apk
