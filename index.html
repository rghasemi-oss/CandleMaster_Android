<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کاربری شبکه توزیع NDN</title>
    <link rel="manifest" href="./app_manifest.json">
    <link rel="icon" type="image/png" href="https://icons8.com">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #E5B83B;
            --accent-hover: #cca331;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --input-bg: #2d2d2d;
            --border: #444;
            --success: #2ecc71;
            --error: #e74c3c;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .auth-container {
            max-width: 400px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border-top: 5px solid var(--accent);
            box-sizing: border-box;
        }

        .dashboard-container {
            max-width: 800px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: none;
            box-sizing: border-box;
        }

        h2 {
            color: var(--accent);
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .btn {
            background-color: var(--accent);
            color: #121212;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .toggle-auth {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .toggle-auth span {
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
        }

        .alert {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
            text-align: center;
        }

        /* استایل داشبورد مدیریت مرسولات */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .user-info { font-size: 14px; color: var(--accent); }
        .logout-btn {
            background: transparent;
            border: 1px solid var(--error);
            color: var(--error);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        .logout-btn:hover { background: rgba(231, 76, 60, 0.1); }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media(min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }

        .sub-card {
            background: #252525;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .server-status {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- بخش اول: فرم ورود و ثبت نام -->
    <div id="auth-section" class="auth-container">
        <h2 id="auth-title">ورود به پنل NDN</h2>
        <div id="auth-alert" class="alert"></div>
        
        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group" id="name-group" style="display: none;">
                <label>نام و نام خانوادگی</label>
                <input type="text" id="auth-name" placeholder="نام خود را وارد کنید">
            </div>
            <div class="form-group">
                <label>آدرس ایمیل</label>
                <input type="email" id="auth-email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>کلمه عبور</label>
                <input type="password" id="auth-password" required placeholder="******">
            </div>
            <button type="submit" id="auth-btn" class="btn">ورود کاربری</button>
        </form>
        
        <div class="toggle-auth" id="toggle-text">
            حساب کاربری ندارید؟ <span onclick="switchAuthMode(true)">ثبت نام کنید</span>
        </div>
        <div class="server-status" id="conn-text">در حال بررسی اتصال به سرور مرکزی...</div>
    </div>

    <!-- بخش دوم: داشبورد اصلی پس از ورود موفقیت آمیز -->
    <div id="dashboard-section" class="dashboard-container">
        <div class="nav-bar">
            <h2>پنل مدیریت مرسولات شبکه توزیع NDN</h2>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span id="user-display" class="user-info">خوش آمدید</span>
                <button class="logout-btn" onclick="logout()">خروج</button>
            </div>
        </div>

        <div class="grid">
            <!-- کارت ثبت مرسوله جدید -->
            <div class="sub-card">
                <h3 style="color: var(--accent); margin-top:0;">ثبت مرسوله جدید</h3>
                <div id="action-alert" class="alert"></div>
                <div class="form-group">
                    <label>نام فرستنده</label>
                    <input type="text" id="dev-sender" placeholder="مثال: شرکت CandleMaster">
                </div>
                <div class="form-group">
                    <label>نام مشتری (گیرنده)</label>
                    <input type="text" id="dev-customer" placeholder="مثال: علیرضا قاسمی">
                </div>
                <div class="form-group">
                    <label>وضعیت اولیه توزیع</label>
                    <select id="dev-status">
                        <option value="PENDING">در انتظار بررسی هاب (PENDING)</option>
                        <option value="IN_TRANSIT">تحویل به پیک - در مسیر (IN_TRANSIT)</option>
                        <option value="DELIVERED">تحویل نهایی به مشتری (DELIVERED)</option>
                    </select>
                </div>
                <button class="btn" onclick="submitDelivery()">ارسال و ثبت در دیتابیس سوپابیس</button>
            </div>

            <!-- کارت آمار و ردیابی -->
            <div class="sub-card">
                <h3 style="color: var(--accent); margin-top:0;">ردیابی و آمار زنده</h3>
                <p style="text-align:right; font-size: 14px;">تعداد کل مرسولات ثبت شده در دیتابیس: <b id="total-count" style="color:var(--accent);">0</b></p>
                <div class="form-group" style="margin-top:20px;">
                    <label>جستجو با کد رهگیری مرسوله</label>
                    <input type="text" id="search-id" placeholder="کد را وارد کنید (مثال: TRK1234)">
                </div>
                <button class="btn" style="background:#333; color:white;" onclick="searchDelivery()">جستجو</button>
                <div id="search-output" style="margin-top:15px; font-size:13px; color:var(--text-muted);"></div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = 'https://onrender.com';
        let isSignUpMode = false;

        // ۱. بررسی زنده اتصال بک‌اند و سوپابیس در بدو ورود
        async function initConnection() {
            const connText = document.getElementById('conn-text');
            try {
                const res = await fetch(SERVER_URL);
                const data = await res.json();
                if(data.status === 'online') {
                    connText.innerHTML = "✅ اتصال امن با سرور رندر و دیتابیس سوپابیس برقرار است.";
                    connText.style.color = "#2ecc71";
                    if(data.totalRecords !== undefined) {
                        document.getElementById('total-count').innerText = data.totalRecords;
                    }
                }
            } catch(e) {
                connText.innerHTML = "⚠️ خطا: اتصال به سرور قطع است. (بک‌اند در حال بارگذاری مجدد)";
                connText.style.color = "#e74c3c";
            }
        }

        // ۲. سوییچ بین حالت ورود و ثبت نام
        function switchAuthMode(signUp) {
            isSignUpMode = signUp;
            document.getElementById('auth-title').innerText = signUp ? "ثبت نام در شبکه NDN" : "ورود به پنل NDN";
