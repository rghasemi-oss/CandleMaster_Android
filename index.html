<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبکه توزیع NDN</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border-top: 5px solid #E5B83B;
        }
        h1 { color: #E5B83B; margin-bottom: 10px; font-size: 24px; }
        p { color: #aaaaaa; font-size: 14px; line-height: 1.6; }
        .status-badge {
            background-color: rgba(229, 184, 59, 0.1);
            color: #E5B83B;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            margin: 20px 0;
        }
        .btn {
            background-color: #E5B83B;
            color: #121212;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #cca331; }
        .loading { color: #E5B83B; }
    </style>
</head>
<body>

    <div class="card">
        <i class="fas fa-boxes" style="font-size: 48px; color: #E5B83B; margin-bottom: 15px;"></i>
        <h1>شبکه توزیع NDN</h1>
        <p>سیستم هوشمند مدیریت و ردیابی مرسولات، هاب‌ها و فرآیندهای توزیع محلی (PUDO)</p>
        
        <div id="status-container">
            <div class="status-badge"><i class="fas fa-spinner fa-spin loading"></i> در حال اتصال به سرور...</div>
        </div>

        <button class="btn" onclick="checkConnection()"><i class="fas fa-sync-alt"></i> بروزرسانی وضعیت</button>
    </div>

    <script>
        // اتصال مستقیم به سرور رندر شما که در مراحل قبل ساختیم
        const SERVER_URL = 'https://onrender.com';

        async function checkConnection() {
            const container = document.getElementById('status-container');
            container.innerHTML = '<div class="status-badge"><i class="fas fa-spinner fa-spin loading"></i> در حال بررسی...</div>';
            
            try {
                const response = await fetch(SERVER_URL);
                const data = await response.json();
                
                if(data.status === 'online') {
                    container.innerHTML = `
                        <div class="status-badge" style="color: #2ecc71; background: rgba(46, 204, 113, 0.1);">
                            <i class="fas fa-check-circle"></i> اتصال به سرور برقرار است
                        </div>
                        <p style="font-size: 12px; color: #666;">نسخه سرویس: ${data.service}</p>
                    `;
                }
            } catch (error) {
                container.innerHTML = `
                    <div class="status-badge" style="color: #e74c3c; background: rgba(231, 76, 60, 0.1);">
                        <i class="fas fa-times-circle"></i> خطا در اتصال به سرور
                    </div>
                `;
            }
        }

        // اجرای خودکار در زمان لود صفحه
        checkConnection();

        // ثبت Service Worker برای قابلیت PWA و نصب شدن برنامه
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('PWA Service Worker Registered!'))
                .catch(err => console.log('Service Worker Error', err));
        }
    </script>
</body>
</html>
